components:
  securitySchemes:
    bearer:
      type: "http"
      scheme: "bearer"
      description: "Opzionale. Vedi `API_TOKEN`."
  responses:
    Error:
      description: "Errore."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    LocalizedText:
      type: "object"
      required:
        - "it"
        - "en"
      properties:
        it:
          type: "string"
        en:
          type: "string"
    Stat:
      type: "object"
      required:
        - "mean"
        - "stdDev"
        - "min"
        - "max"
        - "runs"
        - "stability"
      properties:
        mean:
          type: "number"
        stdDev:
          type: "number"
          minimum: 0
        min:
          type: "number"
        max:
          type: "number"
        runs:
          type: "integer"
          minimum: 1
        stability:
          type: "string"
          enum:
            - "stable"
            - "moderate"
            - "volatile"
    CrawlerMap:
      type: "object"
      additionalProperties:
        type: "string"
        enum:
          - "allow"
          - "block"
          - "partial"
    Audit:
      type: "object"
      required:
        - "score"
        - "checks"
      properties:
        score:
          type: "number"
          minimum: 0
          maximum: 100
        checks:
          type: "object"
          additionalProperties:
            type: "string"
            enum:
              - "pass"
              - "warn"
              - "fail"
    SourceMix:
      type: "object"
      required:
        - "dmo"
        - "editorial"
        - "ota"
        - "other"
      additionalProperties:
        type: "number"
        minimum: 0
        maximum: 1
    Grammar:
      type: "object"
      required:
        - "article"
        - "prep"
        - "articleEn"
      properties:
        article:
          type: "string"
        prep:
          type: "string"
        articleEn:
          type: "string"
    Destination:
      type: "object"
      required:
        - "key"
        - "name"
        - "slug"
        - "region"
        - "lat"
        - "lng"
        - "category"
        - "tags"
        - "visitors"
        - "demand"
        - "demandTier"
        - "grammar"
        - "score"
        - "factors"
        - "byEngine"
        - "categoryRank"
        - "categoryRankRange"
        - "categorySize"
        - "nationalRank"
        - "rankRange"
        - "tier"
        - "trend"
        - "hotelsTracked"
        - "topHotel"
        - "sourceMix"
        - "spark"
      properties:
        key:
          type: "string"
          pattern: "^[a-z0-9][a-z0-9-]*$"
        name:
          $ref: "#/components/schemas/LocalizedText"
        slug:
          $ref: "#/components/schemas/LocalizedText"
        region:
          type: "string"
        lat:
          type: "number"
          minimum: 35
          maximum: 48
        lng:
          type: "number"
          minimum: 6
          maximum: 19
        category:
          type: "string"
          pattern: "^[a-z0-9][a-z0-9-]*$"
        tags:
          type: "array"
          items:
            type: "string"
            pattern: "^[a-z0-9][a-z0-9-]*$"
        visitors:
          type: "number"
          minimum: 0
        demand:
          type: "number"
          minimum: 0
        demandTier:
          type: "string"
          pattern: "^[a-z0-9][a-z0-9-]*$"
        grammar:
          $ref: "#/components/schemas/Grammar"
        score:
          $ref: "#/components/schemas/Stat"
        factors:
          type: "object"
          required:
            - "comparative"
            - "internal"
            - "sources"
            - "technical"
          additionalProperties:
            type: "number"
            minimum: 0
            maximum: 100
        byEngine:
          type: "object"
          required:
            - "chatgpt"
            - "gemini"
            - "perplexity"
          additionalProperties:
            type: "object"
            required:
              - "score"
              - "rank"
            properties:
              score:
                type: "number"
                minimum: 0
                maximum: 100
              rank:
                type: "integer"
                minimum: 1
        categoryRank:
          type: "integer"
          minimum: 1
        categoryRankRange:
          type: "array"
          prefixItems:
            - type: "integer"
              minimum: 1
            - type: "integer"
              minimum: 1
          minItems: 2
          maxItems: 2
        categorySize:
          type: "integer"
          minimum: 1
        nationalRank:
          type: "integer"
          minimum: 1
        rankRange:
          type: "array"
          prefixItems:
            - type: "integer"
              minimum: 1
            - type: "integer"
              minimum: 1
          minItems: 2
          maxItems: 2
        tier:
          type: "string"
          pattern: "^[a-z0-9][a-z0-9-]*$"
        trend:
          type: "number"
        hotelsTracked:
          type: "integer"
          minimum: 0
        topHotel:
          type: "object"
          required:
            - "key"
            - "name"
          properties:
            key:
              type: "string"
            name:
              type: "string"
        sourceMix:
          $ref: "#/components/schemas/SourceMix"
        spark:
          type: "array"
          items:
            type: "number"
    Category:
      type: "object"
      required:
        - "key"
        - "slug"
        - "name"
        - "short"
        - "icon"
        - "lead"
        - "comparativeSubject"
        - "size"
        - "score"
        - "byEngine"
        - "factors"
        - "visitors"
        - "hotelsTracked"
        - "ranking"
      properties:
        key:
          type: "string"
          pattern: "^[a-z0-9][a-z0-9-]*$"
        slug:
          $ref: "#/components/schemas/LocalizedText"
        name:
          $ref: "#/components/schemas/LocalizedText"
        short:
          $ref: "#/components/schemas/LocalizedText"
        icon:
          type: "string"
        lead:
          $ref: "#/components/schemas/LocalizedText"
        comparativeSubject:
          $ref: "#/components/schemas/LocalizedText"
        size:
          type: "integer"
          minimum: 1
        score:
          type: "number"
          minimum: 0
          maximum: 100
        byEngine:
          type: "object"
          required:
            - "chatgpt"
            - "gemini"
            - "perplexity"
          additionalProperties:
            type: "number"
            minimum: 0
            maximum: 100
        factors:
          type: "object"
          required:
            - "comparative"
            - "internal"
            - "sources"
            - "technical"
          additionalProperties:
            type: "number"
            minimum: 0
            maximum: 100
        visitors:
          type: "number"
          minimum: 0
        hotelsTracked:
          type: "integer"
          minimum: 0
        ranking:
          type: "array"
          items:
            type: "string"
            pattern: "^[a-z0-9][a-z0-9-]*$"
    HotelSummary:
      type: "object"
      required:
        - "key"
        - "name"
        - "destination"
        - "destinationName"
        - "category"
        - "area"
        - "stars"
        - "domain"
        - "synthetic"
        - "confidence"
        - "score"
        - "byEngine"
        - "presence"
        - "avgPosition"
        - "auditScore"
        - "trend"
        - "destinationRank"
      properties:
        key:
          type: "string"
        name:
          type: "string"
        destination:
          type: "string"
          pattern: "^[a-z0-9][a-z0-9-]*$"
        destinationName:
          $ref: "#/components/schemas/LocalizedText"
        category:
          type: "string"
          pattern: "^[a-z0-9][a-z0-9-]*$"
        area:
          type:
            - "string"
            - "null"
        stars:
          type: "integer"
          minimum: 1
          maximum: 5
        domain:
          type: "string"
        synthetic:
          type: "boolean"
        confidence:
          type: "string"
          enum:
            - "verified"
            - "registry-web"
            - "registry"
            - "chain"
            - "guarded"
            - "listed"
            - "generated"
        score:
          $ref: "#/components/schemas/Stat"
        byEngine:
          type: "object"
          required:
            - "chatgpt"
            - "gemini"
            - "perplexity"
          additionalProperties:
            type: "number"
            minimum: 0
            maximum: 100
        presence:
          type: "number"
          minimum: 0
          maximum: 1
        avgPosition:
          type: "number"
          minimum: 0
        auditScore:
          type: "number"
          minimum: 0
          maximum: 100
        trend:
          type: "number"
        destinationRank:
          type: "integer"
          minimum: 1
    QuerySummary:
      type: "object"
      required:
        - "key"
        - "destination"
        - "category"
        - "scope"
        - "funnel"
        - "lang"
        - "level"
        - "cluster"
        - "text"
        - "volume"
        - "cpc"
        - "yoy"
        - "difficulty"
        - "spark"
      properties:
        key:
          type: "string"
        destination:
          type: "string"
          pattern: "^[a-z0-9][a-z0-9-]*$"
        category:
          type: "string"
          pattern: "^[a-z0-9][a-z0-9-]*$"
        scope:
          type: "string"
          enum:
            - "destination"
            - "category"
        funnel:
          type: "string"
          pattern: "^[a-z0-9][a-z0-9-]*$"
        lang:
          type: "string"
