openapi: "3.1.0"
info:
  title: "Italian AI Visibility Report — API dell'osservatorio"
  version: "1.0.0"
  description: "Il contratto fra il sito e il backend.\n\nGenerato da `tools/api/openapi.mjs` a partire da `tools/api/contract.mjs`:\nnon modificare a mano, si riscrive a ogni `npm run api:spec`.\n\nRegole valide per tutti gli endpoint:\n- ogni 2xx è un envelope `{data, meta}`;\n- ogni errore è `{error: {status, code, message}}`;\n- le mappe per engine contengono sempre chatgpt, gemini e perplexity;\n- le percentuali sono frazioni 0-1, i punteggi sono 0-100;\n- le chiavi sono stabili nel tempo: finiscono nelle URL pubbliche.\n\nLa conformità si verifica con `npm run api:check -- --base <url>`."
servers:
  - url: "https://api.rankhotel.ai/v1"
    description: "Backend (da realizzare)"
  - url: "https://www.rankhotel.ai/api/v1"
    description: "Fixture statiche generate dal sito"
paths:
  "/meta":
    get:
      operationId: "meta"
      summary: "Costanti del dataset: engine, pesi, fasce, bot, controlli, temi."
      description: "Costanti del dataset: engine, pesi, fasce, bot, controlli, temi.\n\nUsato da: Tutte le pagine. È il primo endpoint chiamato da ogni build."
      parameters: []
      responses:
        "200":
          description: "Risposta conforme al contratto."
          headers:
            Cache-Control:
              description: "Il dataset cambia una volta al mese."
              schema:
                type: "string"
                example: "public, max-age=86400"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "object"
                    required:
                      - "generatedFor"
                      - "seedVersion"
                      - "simulated"
                      - "engines"
                      - "weights"
                      - "runsPerMonth"
                      - "historyMonths"
                      - "firstMeasurement"
                      - "sitesVerifiedOn"
                      - "nationalDmo"
                      - "regionalDmo"
                      - "hotelsPerDestination"
                      - "volatileThreshold"
                      - "tiers"
                      - "demandTiers"
                      - "siteKinds"
                      - "crawlers"
                      - "auditChecks"
                      - "tags"
                    properties:
                      generatedFor:
                        type: "string"
                        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      seedVersion:
                        type: "string"
                      simulated:
                        type: "boolean"
                      engines:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "key"
                            - "label"
                            - "vendor"
                            - "popularityBias"
                            - "editorialBias"
                            - "officialBias"
                            - "crawlers"
                          properties:
                            key:
                              type: "string"
                              enum:
                                - "chatgpt"
                                - "gemini"
                                - "perplexity"
                            label:
                              type: "string"
                            vendor:
                              type: "string"
                            popularityBias:
                              type: "number"
                              minimum: 0
                              maximum: 1
                            editorialBias:
                              type: "number"
                              minimum: 0
                              maximum: 1
                            officialBias:
                              type: "number"
                              minimum: 0
                              maximum: 1
                            crawlers:
                              type: "array"
                              items:
                                type: "string"
                      weights:
                        type: "object"
                        required:
                          - "comparative"
                          - "internal"
                          - "sources"
                          - "technical"
                        additionalProperties:
                          type: "number"
                          minimum: 0
                          maximum: 100
                      runsPerMonth:
                        type: "integer"
                        minimum: 1
                      historyMonths:
                        type: "integer"
                        minimum: 1
                      firstMeasurement:
                        type: "string"
                        pattern: "^\\d{4}-\\d{2}$"
                      sitesVerifiedOn:
                        type: "string"
                        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      nationalDmo:
                        type: "object"
                        required:
                          - "domain"
                          - "holder"
                        properties:
                          domain:
                            type: "string"
                          holder:
                            type: "string"
                      regionalDmo:
                        type: "object"
                        additionalProperties:
                          type: "string"
                      hotelsPerDestination:
                        type: "integer"
                        minimum: 1
                      volatileThreshold:
                        type: "number"
                        minimum: 0
                      tiers:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "key"
                            - "min"
                            - "name"
                          properties:
                            key:
                              type: "string"
                              pattern: "^[a-z0-9][a-z0-9-]*$"
                            min:
                              type: "number"
                            name:
                              $ref: "#/components/schemas/LocalizedText"
                      demandTiers:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "key"
                            - "min"
                            - "name"
                          properties:
                            key:
                              type: "string"
                              pattern: "^[a-z0-9][a-z0-9-]*$"
                            min:
                              type: "number"
                            name:
                              $ref: "#/components/schemas/LocalizedText"
                      siteKinds:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "key"
                            - "name"
                            - "short"
                            - "note"
                          properties:
                            key:
                              type: "string"
                              pattern: "^[a-z0-9][a-z0-9-]*$"
                            name:
                              $ref: "#/components/schemas/LocalizedText"
                            short:
                              $ref: "#/components/schemas/LocalizedText"
                            note:
                              $ref: "#/components/schemas/LocalizedText"
                      crawlers:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "key"
                            - "engine"
                            - "purpose"
                          properties:
                            key:
                              type: "string"
                            engine:
                              type:
                                - "string"
                                - "null"
                              enum:
                                - "chatgpt"
                                - "gemini"
                                - "perplexity"
                            purpose:
                              $ref: "#/components/schemas/LocalizedText"
                      auditChecks:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "key"
                            - "weight"
                            - "name"
                          properties:
                            key:
                              type: "string"
                              pattern: "^[a-z0-9][a-z0-9-]*$"
                            weight:
                              type: "number"
                              minimum: 0
                            name:
                              $ref: "#/components/schemas/LocalizedText"
                      tags:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "key"
                            - "slug"
                            - "icon"
                            - "name"
                            - "lead"
                          properties:
                            key:
                              type: "string"
                              pattern: "^[a-z0-9][a-z0-9-]*$"
                            slug:
                              $ref: "#/components/schemas/LocalizedText"
                            icon:
                              type: "string"
                            name:
                              $ref: "#/components/schemas/LocalizedText"
                            lead:
                              $ref: "#/components/schemas/LocalizedText"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  "/national":
    get:
      operationId: "national"
      summary: "La vista nazionale aggregata, con classifica e movimenti del mese."
      description: "La vista nazionale aggregata, con classifica e movimenti del mese.\n\nUsato da: Home, indice osservatorio, pagine engine."
      parameters: []
      responses:
        "200":
          description: "Risposta conforme al contratto."
          headers:
            Cache-Control:
              description: "Il dataset cambia una volta al mese."
              schema:
                type: "string"
                example: "public, max-age=86400"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "object"
                    required:
                      - "updatedAt"
                      - "destinations"
                      - "hotelsTracked"
                      - "sitesAudited"
                      - "hotelsReal"
                      - "hotelsVerified"
                      - "sitesVerified"
                      - "sitesGenerated"
                      - "promptsPerDestination"
                      - "runsPerMonth"
                      - "responsesAnalyzed"
                      - "score"
                      - "byEngine"
                      - "factors"
                      - "sourceMix"
                      - "langGap"
                      - "funnel"
                      - "crawlers"
                      - "topRising"
                      - "topFalling"
                      - "leaderboard"
                    properties:
                      updatedAt:
                        type: "string"
                        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      destinations:
                        type: "integer"
                        minimum: 1
                      hotelsTracked:
                        type: "integer"
                        minimum: 0
                      sitesAudited:
                        type: "integer"
                        minimum: 0
                      hotelsReal:
                        type: "integer"
                        minimum: 0
                      hotelsVerified:
                        type: "integer"
                        minimum: 0
                      sitesVerified:
                        type: "integer"
                        minimum: 0
                      sitesGenerated:
                        type: "integer"
                        minimum: 0
                      promptsPerDestination:
                        type: "integer"
                        minimum: 1
                      runsPerMonth:
                        type: "integer"
                        minimum: 1
                      responsesAnalyzed:
                        type: "integer"
                        minimum: 0
                      score:
                        type: "number"
                        minimum: 0
                        maximum: 100
                      byEngine:
                        type: "object"
                        required:
                          - "chatgpt"
                          - "gemini"
                          - "perplexity"
                        additionalProperties:
                          type: "number"
                          minimum: 0
                          maximum: 100
                      factors:
                        type: "object"
                        required:
                          - "comparative"
                          - "internal"
                          - "sources"
                          - "technical"
                        additionalProperties:
                          type: "number"
                          minimum: 0
                          maximum: 100
                      sourceMix:
                        $ref: "#/components/schemas/SourceMix"
                      langGap:
                        type: "object"
                        required:
                          - "it"
                          - "en"
                        additionalProperties:
                          type: "number"
                          minimum: 0
                          maximum: 100
                      funnel:
                        type: "object"
                        additionalProperties:
                          type: "number"
                          minimum: 0
                          maximum: 100
                      crawlers:
                        type: "object"
                        additionalProperties:
                          type: "object"
                          required:
                            - "engine"
                            - "purpose"
                            - "allow"
                            - "partial"
                            - "block"
                          properties:
                            engine:
                              type:
                                - "string"
                                - "null"
                              enum:
                                - "chatgpt"
                                - "gemini"
                                - "perplexity"
                            purpose:
                              $ref: "#/components/schemas/LocalizedText"
                            allow:
                              type: "number"
                              minimum: 0
                              maximum: 1
                            partial:
                              type: "number"
                              minimum: 0
                              maximum: 1
                            block:
                              type: "number"
                              minimum: 0
                              maximum: 1
                      topRising:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "key"
                            - "name"
                            - "trend"
                            - "score"
                          properties:
                            key:
                              type: "string"
                              pattern: "^[a-z0-9][a-z0-9-]*$"
                            name:
                              $ref: "#/components/schemas/LocalizedText"
                            trend:
                              type: "number"
                            score:
                              type: "number"
                              minimum: 0
                              maximum: 100
                      topFalling:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "key"
                            - "name"
                            - "trend"
                            - "score"
                          properties:
                            key:
                              type: "string"
                              pattern: "^[a-z0-9][a-z0-9-]*$"
                            name:
                              $ref: "#/components/schemas/LocalizedText"
                            trend:
                              type: "number"
                            score:
                              type: "number"
                              minimum: 0
                              maximum: 100
                      leaderboard:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "key"
                            - "name"
                            - "slug"
                            - "score"
                            - "category"
                          properties:
                            key:
                              type: "string"
                              pattern: "^[a-z0-9][a-z0-9-]*$"
                            name:
                              $ref: "#/components/schemas/LocalizedText"
                            slug:
                              $ref: "#/components/schemas/LocalizedText"
                            score:
                              type: "number"
                              minimum: 0
                              maximum: 100
                            category:
                              type: "string"
                              pattern: "^[a-z0-9][a-z0-9-]*$"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  "/categories":
    get:
      operationId: "categories"
      summary: "Le cinque categorie di confronto, con la loro classifica interna."
      description: "Le cinque categorie di confronto, con la loro classifica interna.\n\nUsato da: Indice osservatorio, pagine categoria, filtri delle query."
      parameters: []
      responses:
        "200":
          description: "Risposta conforme al contratto."
          headers:
            Cache-Control:
              description: "Il dataset cambia una volta al mese."
              schema:
                type: "string"
                example: "public, max-age=86400"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Category"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  "/categories/{key}":
    get:
      operationId: "category"
      summary: "Una singola categoria. 404 se la chiave non esiste."
      description: "Una singola categoria. 404 se la chiave non esiste.\n\nUsato da: Pagina categoria, quando serve senza scaricare l'elenco intero."
      parameters:
        - name: "key"
          in: "path"
          required: true
          description: "Chiave stabile. Esempio: `mare`."
          schema:
            type: "string"
      responses:
        "200":
          description: "Risposta conforme al contratto."
          headers:
            Cache-Control:
              description: "Il dataset cambia una volta al mese."
              schema:
                type: "string"
                example: "public, max-age=86400"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  "/destinations":
    get:
      operationId: "destinations"
      summary: "Le 100 destinazioni in classifica, filtrabili e ordinabili."
      description: "Le 100 destinazioni in classifica, filtrabili e ordinabili.\n\nUsato da: Classifica nazionale, pagine categoria e tema, mappa, confronto."
      parameters:
        - name: "q"
          in: "query"
          required: false
          description: "Ricerca su nome e regione, senza accenti."
          schema:
            type: "string"
        - name: "category"
          in: "query"
          required: false
          description: "Chiave categoria primaria."
          schema:
            type: "string"
        - name: "tag"
          in: "query"
          required: false
          description: "Tema: include anche la categoria primaria."
          schema:
            type: "string"
        - name: "region"
          in: "query"
          required: false
          description: "Nome regione, esatto."
          schema:
            type: "string"
        - name: "tier"
          in: "query"
          required: false
          description: "Chiave fascia (a…e)."
          schema:
            type: "string"
        - name: "engine"
          in: "query"
          required: false
          description: "Ordina per il punteggio di questo engine invece che per la media."
          schema:
            type: "string"
            enum:
              - "chatgpt"
              - "gemini"
              - "perplexity"
        - name: "sort"
          in: "query"
          required: false
          description: "Campo di ordinamento."
          schema:
            type: "string"
            enum:
              - "score"
              - "visitors"
              - "demand"
              - "trend"
              - "name"
              - "nationalRank"
            default: "score"
        - name: "dir"
          in: "query"
          required: false
          description: "Verso dell'ordinamento."
          schema:
            type: "string"
            enum:
              - "asc"
              - "desc"
            default: "desc"
        - name: "page"
          in: "query"
          required: false
          description: "Pagina, 1-based."
          schema:
            type: "integer"
            default: 1
        - name: "pageSize"
          in: "query"
          required: false
          description: "Righe per pagina. Massimo 500."
          schema:
            type: "integer"
            default: 60
      responses:
        "200":
          description: "Risposta conforme al contratto."
          headers:
            Cache-Control:
              description: "Il dataset cambia una volta al mese."
              schema:
                type: "string"
                example: "public, max-age=86400"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Destination"
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  "/destinations/{key}":
    get:
      operationId: "destination"
      summary: "Il dettaglio completo di una destinazione: punteggi, storico, prompt, risposte, siti, hotel, query. ~110 KB. 404 se la chiave non esiste."
      description: "Il dettaglio completo di una destinazione: punteggi, storico, prompt, risposte, siti, hotel, query. ~110 KB. 404 se la chiave non esiste.\n\nUsato da: Scheda destinazione (200 pagine) e pagina di confronto."
      parameters:
        - name: "key"
          in: "path"
          required: true
          description: "Chiave stabile. Esempio: `roma`."
          schema:
            type: "string"
      responses:
        "200":
          description: "Risposta conforme al contratto."
          headers:
            Cache-Control:
              description: "Il dataset cambia una volta al mese."
              schema:
                type: "string"
                example: "public, max-age=86400"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "data"
                  - "meta"
                properties:
                  data:
                    type: "object"
                    required:
                      - "key"
                      - "name"
                      - "slug"
                      - "region"
                      - "lat"
                      - "lng"
                      - "category"
                      - "tags"
                      - "visitors"
                      - "demand"
                      - "demandTier"
                      - "grammar"
                      - "score"
                      - "factors"
                      - "byEngine"
                      - "categoryRank"
                      - "categoryRankRange"
                      - "categorySize"
                      - "nationalRank"
                      - "rankRange"
                      - "tier"
                      - "trend"
                      - "hotelsTracked"
                      - "topHotel"
                      - "sourceMix"
                      - "spark"
                      - "knownFor"
                      - "updatedAt"
                      - "runsPerMonth"
                      - "scoreDetail"
                      - "history"
                      - "entities"
                      - "prompts"
                      - "summary"
                      - "sites"
                      - "sources"
                      - "hotels"
                      - "queries"
                      - "answers"
                      - "technical"
                    properties:
                      key:
                        type: "string"
                        pattern: "^[a-z0-9][a-z0-9-]*$"
                      name:
                        $ref: "#/components/schemas/LocalizedText"
                      slug:
                        $ref: "#/components/schemas/LocalizedText"
                      region:
                        type: "string"
                      lat:
                        type: "number"
                        minimum: 35
                        maximum: 48
                      lng:
                        type: "number"
                        minimum: 6
                        maximum: 19
                      category:
                        type: "string"
                        pattern: "^[a-z0-9][a-z0-9-]*$"
                      tags:
                        type: "array"
                        items:
                          type: "string"
                          pattern: "^[a-z0-9][a-z0-9-]*$"
                      visitors:
                        type: "number"
                        minimum: 0
                      demand:
                        type: "number"
                        minimum: 0
                      demandTier:
                        type: "string"
                        pattern: "^[a-z0-9][a-z0-9-]*$"
                      grammar:
                        $ref: "#/components/schemas/Grammar"
                      score:
                        $ref: "#/components/schemas/Stat"
                      factors:
                        type: "object"
                        required:
                          - "comparative"
                          - "internal"
                          - "sources"
                          - "technical"
                        additionalProperties:
                          type: "number"
                          minimum: 0
                          maximum: 100
                      byEngine:
                        type: "object"
                        required:
                          - "chatgpt"
                          - "gemini"
                          - "perplexity"
                        additionalProperties:
                          type: "object"
                          required:
                            - "score"
                            - "rank"
                          properties:
                            score:
                              type: "number"
                              minimum: 0
                              maximum: 100
                            rank:
                              type: "integer"
                              minimum: 1
                      categoryRank:
                        type: "integer"
                        minimum: 1
                      categoryRankRange:
                        type: "array"
                        prefixItems:
                          - type: "integer"
                            minimum: 1
                          - type: "integer"
                            minimum: 1
                        minItems: 2
                        maxItems: 2
                      categorySize:
                        type: "integer"
                        minimum: 1
                      nationalRank:
                        type: "integer"
                        minimum: 1
                      rankRange:
                        type: "array"
                        prefixItems:
                          - type: "integer"
                            minimum: 1
                          - type: "integer"
                            minimum: 1
                        minItems: 2
                        maxItems: 2
                      tier:
                        type: "string"
                        pattern: "^[a-z0-9][a-z0-9-]*$"
                      trend:
                        type: "number"
                      hotelsTracked:
                        type: "integer"
                        minimum: 0
                      topHotel:
                        type: "object"
                        required:
                          - "key"
                          - "name"
                        properties:
                          key:
                            type: "string"
                          name:
                            type: "string"
                      sourceMix:
                        $ref: "#/components/schemas/SourceMix"
                      spark:
                        type: "array"
                        items:
                          type: "number"
                      knownFor:
                        type: "array"
                        items:
                          type: "string"
                      updatedAt:
                        type: "string"
                        pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                      runsPerMonth:
                        type: "integer"
                        minimum: 1
                      scoreDetail:
                        type: "object"
                        required:
                          - "overall"
                          - "byEngine"
                        properties:
                          overall:
                            type: "object"
                            required:
                              - "score"
                              - "factors"
                            properties:
                              score:
                                $ref: "#/components/schemas/Stat"
                              factors:
                                type: "object"
                                required:
                                  - "comparative"
                                  - "internal"
                                  - "sources"
                                  - "technical"
                                additionalProperties:
                                  $ref: "#/components/schemas/Stat"
                          byEngine:
                            type: "object"
                            required:
                              - "chatgpt"
                              - "gemini"
                              - "perplexity"
                            additionalProperties:
                              type: "object"
                              required:
                                - "score"
                                - "factors"
                              properties:
                                score:
