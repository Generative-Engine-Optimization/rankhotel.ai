  "/prompts":
    get:
      operationId: "prompts"
      summary: "I 50 template di prompt e i cinque stadi del funnel."
      description: "I 50 template di prompt e i cinque stadi del funnel.\n\nUsato da: Metodologia, assunzioni, scheda destinazione."
      parameters: []
      responses:
        "200":
          description: "Risposta conforme al contratto."
          headers:
            Cache-Control:
              description: "Il dataset cambia una volta al mese."
              schema:
                type: "string"
